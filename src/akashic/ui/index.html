<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Akashic · local memory</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="shell" id="shell">
    <nav class="sidebar" id="sidebar" aria-label="Main">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Akashic</a>
      <a class="nav-link new-chat" data-route="ask" href="#/"><span class="plus"><span data-i="plus"></span></span>New question</a>
      <a class="nav-link" data-route="search" href="#/search"><span data-i="search"></span>Search</a>
      <a class="nav-link" data-route="timeline" href="#/timeline"><span data-i="clock"></span>Timeline</a>
      <a class="nav-link" data-route="speakers" href="#/speakers"><span data-i="people"></span>Speakers</a>
      <div class="sidebar-label" id="recents-label">Recents</div>
      <div class="recents" id="recents" aria-labelledby="recents-label"></div>
      <div class="sidebar-foot">
        <div class="status-line">
          <span class="dot" id="status-dot"></span><span id="status-text">…</span>
          <button type="button" id="pause-btn" hidden>Pause</button>
        </div>
        <div class="status-count" id="status-count"></div>
        <a class="nav-link" data-route="settings" href="#/settings"><span data-i="sliders"></span>Settings</a>
      </div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button type="button" class="ghost icon-btn" id="menu-btn" aria-label="Open the menu" aria-controls="sidebar" aria-expanded="false"><span data-i="menu"></span></button>
        <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"></span>Akashic</a>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <!-- Icons, cloned by icon() in app.js. Drawn for this app: simple strokes on a 24px grid. -->
  <template id="icons">
    <svg data-icon="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    <svg data-icon="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
    <svg data-icon="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    <svg data-icon="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .6 3.5 2.6 3.5 5"/></svg>
    <svg data-icon="sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
    <svg data-icon="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    <svg data-icon="x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    <svg data-icon="arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
    <svg data-icon="arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11.5 18.5 5 12l6.5-6.5"/></svg>
    <svg data-icon="chev-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    <svg data-icon="chev-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
    <svg data-icon="play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
    <svg data-icon="stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
    <svg data-icon="copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
    <svg data-icon="check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
    <svg data-icon="list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
    <svg data-icon="layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>
    <svg data-icon="filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></svg>
    <svg data-icon="trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    <svg data-icon="k-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
    <svg data-icon="k-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>
    <svg data-icon="k-conversation" viewBox="0 0 24 24"><path d="M4 5h16v11H10l-6 4zM8 9h8M8 12.5h5"/></svg>
    <svg data-icon="k-browsing" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 2.6 15.2 0 18M12 3c-2.6 2.8-2.6 15.2 0 18"/></svg>
    <svg data-icon="k-work" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <svg data-icon="k-game" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7.5 10.5v4M5.5 12.5h4M15.5 11.5h.01M18 13.5h.01"/></svg>
  </template>

  <script src="/static/app.js" defer></script>
  <script src="/static/debug.js" defer></script>
  <script src="/static/settings.js" defer></script>
  <script src="/static/stt.js" defer></script>
  <script src="/static/speakers.js" defer></script>
  <script src="/static/memory.js" defer></script>
</body>
</html>
