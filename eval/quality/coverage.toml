# Coverage matrix: 13 dimensions x 41 cases. A cell (d, c) is filled when at least one truth item
# of dimension d overlaps a step tagged c. `core` cases are the ones the 5 min smoke run covers.
# Impossible cells name a reason. "dims" and "cases" take ids, "all", or "@group" for a case group.

[dimensions]
1 = "When the screen is captured"
2 = "App tagging per window and frame"
3 = "Text: UIA vs OCR, accuracy, de-duplication"
4 = "Browser and media identity"
5 = "Timeline continuity and durations"
6 = "Media and game session boundaries"
7 = "Sound separated per application"
8 = "Voice detection, segmentation, speakers"
9 = "Transcription"
10 = "Privacy"
11 = "Episodes"
12 = "Index coverage and delay"
13 = "Life-event loss"

